<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Control restaurado</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#17202a}header{background:#17202a;color:white;padding:18px}.wrap{max-width:800px;margin:auto;padding:14px}.card{background:white;padding:16px;border-radius:16px;margin-bottom:12px}input,select,button{width:100%;padding:12px;margin:5px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}button{background:#2563eb;color:white;font-weight:700}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{width:auto;background:white;color:#17202a}.page{display:none}.page.active{display:block}.money{color:#15803d;font-weight:700}.item{border-top:1px solid #eee;padding:10px 0}</style></head><body><header><h2>Mi Control</h2><small>Versión restaurada · estable</small></header><main class="wrap"><div class="tabs"><button onclick="show('inicio')">Inicio</button><button onclick="show('jornadas')">Jornadas</button><button onclick="show('finanzas')">Finanzas</button><button onclick="show('config')">Config.</button></div><section id="inicio" class="page active"><div class="card"><h3>Resumen</h3><div id="resumen"></div></div></section><section id="jornadas" class="page"><div class="card"><h3>Registrar jornada</h3><label>Fecha</label><input id="jFecha" type="date"><label>Entrada</label><input id="jEntrada" type="time" value="08:00"><label>Salida</label><input id="jSalida" type="time"><select id="jTipo"><option value="normal">Trabajé normalmente</option><option value="festivo">Festivo / trato</option><option value="no_trabajado">No trabajé</option></select><button onclick="guardarJ()">Guardar jornada</button></div><div class="card"><h3>Jornadas</h3><div id="listaJ"></div></div></section><section id="finanzas" class="page"><div class="card"><h3>Registrar movimiento</h3><label>Fecha</label><input id="fFecha" type="date"><select id="fTipo"><option value="gasto">Gasto</option><option value="ahorro">Ahorro</option></select><label>Concepto</label><input id="fConcepto"><label>Monto</label><input id="fMonto" type="text" inputmode="numeric" placeholder="$0"><button onclick="guardarF()">Guardar movimiento</button></div><div class="card"><h3>Movimientos</h3><div id="listaF"></div></div></section><section id="config" class="page"><div class="card"><h3>Configuración</h3><label>Sueldo base</label><input id="cfgSueldo" type="text" inputmode="numeric"><label>Valor hora extra</label><input id="cfgHE" type="text" inputmode="numeric"><label>Valor trato</label><input id="cfgTrato" type="text" inputmode="numeric"><button onclick="guardarCfg()">Guardar</button></div></section></main><script>const K='miControlV2',pad=n=>String(n).padStart(2,'0');function hoy(){let d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function clp(n){return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0)}function parse(v){return Number(String(v||'').replace(/[^0-9]/g,''))||0}const def={config:{sueldo:629997,valorHE:5250,trato:88000,horarios:{1:'16:30',2:'16:30',3:'17:30',4:'17:30',5:'16:30',6:'08:00'}},jornadas:[],comp:[],fin:[]};let db;try{db={...def,...JSON.parse(localStorage.getItem(K)||'{}')} }catch{db=JSON.parse(JSON.stringify(def))}function save(){localStorage.setItem(K,JSON.stringify(db));render()}function mins(t){if(!t)return 0;let[a,b]=t.split(':').map(Number);return a*60+b}function calc(j){let d=new Date(j.fecha+'T12:00').getDay();if(j.tipo==='no_trabajado')return{he:0,tr:false};if(j.tipo==='festivo'||d===0)return{he:0,tr:true};let b=db.config.horarios?.[d];return{he:b?Math.max(0,mins(j.salida)-mins(b)):0,tr:false}}function render(){let he=0,tr=0;(db.jornadas||[]).forEach(j=>{let c=calc(j);he+=c.he;if(c.tr)tr++});resumen.innerHTML='<p>Horas extra: <b>'+Math.floor(he/60)+' h '+pad(he%60)+' min</b></p><p>Tratos: <b>'+tr+'</b></p><p>HE estimadas: <span class="money">'+clp(he/60*db.config.valorHE)+'</span></p>';listaJ.innerHTML=[...(db.jornadas||[])].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(j=>{let c=calc(j);return '<div class="item"><b>'+j.fecha+'</b> · '+(c.tr?'TRATO':Math.floor(c.he/60)+' h '+pad(c.he%60)+' min')+'</div>'}).join('')||'Sin jornadas';listaF.innerHTML=[...(db.fin||[])].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(x=>'<div class="item"><b>'+String(x.concepto||'Movimiento').replace(/[<>]/g,'')+'</b> · '+clp(x.monto)+'</div>').join('')||'Sin movimientos';cfgSueldo.value=db.config.sueldo||'';cfgHE.value=db.config.valorHE||'';cfgTrato.value=db.config.trato||''}function guardarJ(){if(!jFecha.value)return alert('Falta fecha');if(jTipo.value!=='no_trabajado'&&(!jSalida.value||mins(jSalida.value)<=mins(jEntrada.value)))return alert('Revisa las horas');db.jornadas=db.jornadas||[];db.jornadas.push({fecha:jFecha.value,entrada:jEntrada.value,salida:jSalida.value,tipo:jTipo.value});save()}function guardarF(){let m=parse(fMonto.value);if(!fFecha.value||!fConcepto.value.trim()||!m)return alert('Completa los datos');db.fin=db.fin||[];db.fin.push({fecha:fFecha.value,tipo:fTipo.value,concepto:fConcepto.value.trim(),monto:m});fMonto.value='';fConcepto.value='';save()}function guardarCfg(){db.config={...db.config,sueldo:parse(cfgSueldo.value),valorHE:parse(cfgHE.value),trato:parse(cfgTrato.value)};save()}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}jFecha.value=fFecha.value=hoy();save();</script></body></html>

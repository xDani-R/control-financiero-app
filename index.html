<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17202a"><title>Mi Control</title><style>:root{--bg:#f4f6f8;--card:#fff;--ink:#17202a;--muted:#64748b;--blue:#2563eb;--green:#15803d;--greenbg:#f0fdf4;--dark:#334155;--darkbg:#f1f5f9;--purple:#6d28d9;--purplebg:#ede9fe;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{background:#17202a;color:#fff;padding:18px 16px}header h1{margin:0;font-size:23px}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}.version{font-size:11px;color:#94a3b8;margin-top:6px}.wrap{width:100%;max-width:820px;margin:auto;padding:14px 14px 80px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{width:auto;flex:0 0 auto;white-space:nowrap;border:0;border-radius:999px;padding:10px 14px;margin:0;background:#fff;color:#475569;font-weight:750}.tabs button.active{background:#17202a;color:#fff}.page{display:none}.page.active{display:block}.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #00000012}h2{font-size:18px;margin:0 0 14px}label{display:block;font-size:13px;font-weight:750;margin:11px 0 5px}input,select{display:block;width:100%;min-width:0;padding:12px;border:1px solid #d1d5db;border-radius:11px;background:#fff;color:var(--ink);font-size:16px}button{border:0;border-radius:11px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{width:100%;margin-top:14px;background:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{padding:14px;border-radius:14px;background:#f8fafc;min-width:0}.stat small{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:19px;margin-top:4px;overflow-wrap:anywhere}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.money{color:var(--green)}.finance-item{border-radius:13px;padding:12px;margin-top:8px;border:1px solid var(--line)}.finance-item.saving{background:var(--greenbg);border-color:#bbf7d0}.finance-item.expense{background:var(--darkbg);border-color:#e2e8f0}.finance-item .amount{font-weight:850;white-space:nowrap}.finance-item.saving .amount,.finance-item.saving .kind{color:var(--green)}.finance-item.expense .amount,.finance-item.expense .kind{color:var(--dark)}.kind{display:inline-block;margin-top:5px;font-size:12px;font-weight:800}.tag-trato{display:inline-block;background:var(--purplebg);color:var(--purple);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.empty{color:var(--muted);text-align:center;padding:18px}.summary-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.summary-row:last-child{border-bottom:0}.summary-row span{color:var(--muted)}@media(max-width:520px){.wrap{padding:10px 10px 70px}.card{padding:14px;border-radius:14px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.finance-item .top{flex-wrap:wrap}.finance-item .amount{margin-left:auto}header{padding:16px 14px}}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><header><h1>Mi Control</h1><p>Tu jornada y tu plata sin enredos.</p><div class="version">Versión restaurada · UI corregida</div></header><main class="wrap"><nav class="tabs" id="tabs"><button class="active" data-page="inicio" onclick="show('inicio',this)">Inicio</button><button data-page="jornadas" onclick="show('jornadas',this)">Jornadas</button><button data-page="finanzas" onclick="show('finanzas',this)">Finanzas</button><button data-page="config" onclick="show('config',this)">⚙️ Config.</button></nav><section id="inicio" class="page active"><div class="card"><h2>Resumen</h2><div id="resumen" class="grid"></div></div></section><section id="jornadas" class="page"><div class="card"><h2>Registrar jornada</h2><label>Fecha</label><input id="jFecha" type="date"><label>Entrada</label><input id="jEntrada" type="time" value="08:00"><label>Salida</label><input id="jSalida" type="time"><label>Tipo de día</label><select id="jTipo"><option value="normal">Trabajé normalmente</option><option value="festivo">Festivo / trato</option><option value="no_trabajado">No trabajé</option></select><button class="primary" onclick="guardarJ()">Guardar jornada</button></div><div class="card"><h2>Jornadas</h2><div id="listaJ"></div></div></section><section id="finanzas" class="page"><div class="card"><h2>Registrar movimiento</h2><label>Fecha</label><input id="fFecha" type="date"><label>Tipo</label><select id="fTipo"><option value="gasto">Gasto</option><option value="ahorro">Ahorro</option></select><label>Concepto</label><input id="fConcepto" placeholder="Ej: supermercado"><label>Monto</label><input id="fMonto" type="text" inputmode="numeric" placeholder="$0"><button class="primary" onclick="guardarF()">Guardar movimiento</button></div><div class="card"><h2>Movimientos</h2><div id="listaF"></div></div></section><section id="config" class="page"><div class="card"><h2>Configuración</h2><label>Sueldo base</label><input id="cfgSueldo" type="text" inputmode="numeric"><label>Valor hora extra</label><input id="cfgHE" type="text" inputmode="numeric"><label>Valor trato</label><input id="cfgTrato" type="text" inputmode="numeric"><button class="primary" onclick="guardarCfg()">Guardar configuración</button></div></section></main><script>const K='miControlV2',pad=n=>String(n).padStart(2,'0');function hoy(){let d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function clp(n){return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0)}function parse(v){return Number(String(v||'').replace(/[^0-9]/g,''))||0}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const def={config:{sueldo:629997,valorHE:5250,trato:88000,horarios:{1:'16:30',2:'16:30',3:'17:30',4:'17:30',5:'16:30',6:'08:00'}},jornadas:[],comp:[],fin:[]};let db;try{let saved=JSON.parse(localStorage.getItem(K)||'{}');db={...def,...saved,config:{...def.config,...(saved.config||{}),horarios:{...def.config.horarios,...(saved.config?.horarios||{})}},jornadas:saved.jornadas||[],comp:saved.comp||[],fin:saved.fin||[]}}catch{db=JSON.parse(JSON.stringify(def))}function save(){localStorage.setItem(K,JSON.stringify(db));render()}function mins(t){if(!t)return 0;let[a,b]=t.split(':').map(Number);return a*60+b}function calc(j){let d=new Date(j.fecha+'T12:00').getDay();if(j.tipo==='no_trabajado')return{he:0,tr:false};if(j.tipo==='festivo'||d===0)return{he:0,tr:true};let b=db.config.horarios?.[d];return{he:b&&j.salida?Math.max(0,mins(j.salida)-mins(b)):0,tr:false}}function render(){let he=0,tr=0;db.jornadas.forEach(j=>{let c=calc(j);he+=c.he;if(c.tr)tr++});resumen.innerHTML='<div class="stat"><small>Horas extra</small><b>'+Math.floor(he/60)+' h '+pad(he%60)+' min</b></div><div class="stat"><small>Tratos</small><b>'+tr+'</b></div><div class="stat"><small>HE estimadas</small><b class="money">'+clp(he/60*db.config.valorHE)+'</b></div>';listaJ.innerHTML=[...db.jornadas].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(j=>{let c=calc(j);return '<div class="item"><div class="top"><b>'+esc(j.fecha)+'</b>'+(c.tr?'<span class="tag-trato">TRATO</span>':'<b>'+Math.floor(c.he/60)+' h '+pad(c.he%60)+' min</b>')+'</div><small style="color:#64748b">'+(j.tipo==='no_trabajado'?'No trabajado':esc((j.entrada||'--')+' → '+(j.salida||'--')))+'</small></div>'}).join('')||'<div class="empty">Sin jornadas registradas.</div>';listaF.innerHTML=[...db.fin].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(x=>'<div class="finance-item '+(x.tipo==='ahorro'?'saving':'expense')+'"><div class="top"><div><b>'+esc(x.concepto||'Movimiento')+'</b><br><span class="kind">'+(x.tipo==='ahorro'?'AHORRO':'GASTO')+'</span></div><span class="amount">'+clp(x.monto)+'</span></div><small style="color:#64748b">'+esc(x.fecha)+'</small></div>').join('')||'<div class="empty">Sin movimientos.</div>';cfgSueldo.value=db.config.sueldo||'';cfgHE.value=db.config.valorHE||'';cfgTrato.value=db.config.trato||''}function guardarJ(){if(!jFecha.value)return alert('Falta fecha');if(jTipo.value!=='no_trabajado'&&(!jSalida.value||mins(jSalida.value)<=mins(jEntrada.value)))return alert('Revisa las horas');db.jornadas.push({fecha:jFecha.value,entrada:jEntrada.value,salida:jSalida.value,tipo:jTipo.value});jSalida.value='';save()}function guardarF(){let m=parse(fMonto.value);if(!fFecha.value||!fConcepto.value.trim()||!m)return alert('Completa los datos');db.fin.push({fecha:fFecha.value,tipo:fTipo.value,concepto:fConcepto.value.trim(),monto:m});fMonto.value='';fConcepto.value='';save()}function guardarCfg(){db.config={...db.config,sueldo:parse(cfgSueldo.value),valorHE:parse(cfgHE.value),trato:parse(cfgTrato.value)};save();alert('Configuración guardada')}function show(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(btn)btn.classList.add('active')}jFecha.value=fFecha.value=hoy();save();</script></body></html>
